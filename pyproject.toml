[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeformer"
version = "1.3.2"
description = "Towards Robust Blind Face Restoration with Codebook Lookup Transformer (NeurIPS 2022)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "NTU S-Lab License 1.0" }
authors = [{ name = "Shangchen Zhou" }]
dependencies = [
    "addict>=2.4.0",
    "ffmpeg-python>=0.2.0",
    "gdown>=5.2.0",
    "lmdb>=1.4.1",
    "lpips>=0.1.4",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9.0.80",
    "packaging>=23.2",
    "Pillow>=10.2.0",
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
    "scikit-image>=0.22.0",
    "scipy>=1.11",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
train = ["tensorboard>=2.16.0", "yapf>=0.40.2"]
demo = ["gradio>=4.44"]

[project.urls]
Homepage = "https://github.com/sczhou/CodeFormer"

[tool.setuptools]
packages = ["basicsr", "facelib"]

[tool.ruff]
line-length = 120
target-version = "py310"
